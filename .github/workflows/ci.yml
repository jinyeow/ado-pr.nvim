name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (neovim ${{ matrix.neovim_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neovim_version: [stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim_version }}

      - name: Run test suite
        run: |
          set -euo pipefail
          for f in tests/*.lua; do
            echo "== $f =="
            nvim --headless -l "$f"
          done

  lint:
    name: stylua
    runs-on: ubuntu-latest
    # Codebase predates .stylua.toml and isn't reformatted yet (tracked ticket).
    # Report only, don't block, until that reformat PR lands.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/ tests/
